name: DexGPT Visual Candidate Runner

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate-and-capture:
    if: startsWith(github.head_ref, 'dexgpt-visual-') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Read candidate contract
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=require('./docs/visual-evolution/candidate.json'); for(const [k,v] of Object.entries(c)) console.log(k+'='+v)" >> "$GITHUB_OUTPUT"
      - name: Validate source
        run: |
          set -euo pipefail
          npm ci
          npm run validate
      - name: Launch deterministic browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run serve > /tmp/dexgpt-serve.log 2>&1 &
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then echo 'No Chromium-family browser available' >&2; exit 2; fi
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9227 --user-data-dir=/tmp/dexgpt-chrome about:blank > /tmp/dexgpt-chrome.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9227/json/version >/dev/null 2>&1 && exit 0
            sleep 0.25
          done
          cat /tmp/dexgpt-serve.log >&2 || true
          cat /tmp/dexgpt-chrome.log >&2 || true
          exit 3
      - name: Capture matched candidate evidence
        shell: bash
        run: |
          set -u
          iteration='${{ steps.candidate.outputs.iteration }}'
          revision='${{ steps.candidate.outputs.revision }}'
          checkpoint='${{ steps.candidate.outputs.checkpoint }}'
          neighbor='${{ steps.candidate.outputs.neighbor }}'
          previous=$((revision-1))
          dir="docs/visual-evolution/iteration-${iteration}"
          mkdir -p "$dir"
          before_rc=0; after_rc=0; neighbor_rc=0
          node --experimental-websocket scripts/cdp-capture.mjs "$previous" "$checkpoint" "$dir/before.png" || before_rc=$?
          node --experimental-websocket scripts/cdp-capture.mjs "$revision" "$checkpoint" "$dir/after.png" || after_rc=$?
          node --experimental-websocket scripts/cdp-capture.mjs "$revision" "$neighbor" "$dir/candidate-neighbor.png" || neighbor_rc=$?
          printf 'before_rc=%s\nafter_rc=%s\nneighbor_rc=%s\n' "$before_rc" "$after_rc" "$neighbor_rc" > "$dir/candidate-status.txt"
          printf '# Candidate evidence\n\nBranch: `%s`\nHead: `%s`\nRevision: %s\nCheckpoint: `%s`\nNeighbor: `%s`\n\nThis is candidate evidence only; it is not an accepted numbered iteration.\n' "${{ github.head_ref }}" "$(git rev-parse HEAD)" "$revision" "$checkpoint" "$neighbor" > "$dir/candidate-report.md"
      - name: Persist candidate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DexGPT visual QA'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/visual-evolution/iteration-* || true
          if ! git diff --cached --quiet; then
            git commit -m 'staging: persist visual candidate evidence'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Enforce browser proof gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="docs/visual-evolution/iteration-${{ steps.candidate.outputs.iteration }}/candidate-status.txt"
          test -f "$status"
          grep -qx 'before_rc=0' "$status"
          grep -qx 'after_rc=0' "$status"
          grep -qx 'neighbor_rc=0' "$status"
