name: DexGPT Binary Stage

on:
  push:
    branches:
      - dexgpt-staging
    paths:
      - '.github/workflows/dexgpt-binary-stage.yml'
      - '.binary-stage/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dexgpt-staging
          fetch-depth: 0
      - name: Recover or assemble verified primary
        shell: bash
        run: |
          set -euo pipefail
          LOG='docs/visual-evolution/tooling/binary-stage.log'
          OUT='assets/source-reference/shard-god/1761893423477.jpg.png'
          EXPECTED='17fbbffea8e4e079295b0cd651dcccb4749d4548d209c9b1bdd74ae6d504ee73'
          EXPECTED_PIXELS='77e5efea67ae7e6150667c49dc81089a884c99a3df726626f0816ecdea5d4981'
          mkdir -p "$(dirname "$LOG")" "$(dirname "$OUT")"
          printf 'trigger_sha=%s\n' "$GITHUB_SHA" > "$LOG"

          if [ -f .binary-stage/canva-primary.request ]; then
            matched=0
            for url in \
              'https://media.canva.com/v2/image-resize/format:PNG/height:1248/quality:100/uri:ifs%3A%2F%2FM%2F37b55bdc-1b17-4435-bbf5-8377eb01bc30/width:832' \
              'https://media.canva.com/v2/image-resize/format:PNG/height:1248/quality:100/uri:ifs%3A%2F%2FM%2F37b55bdc-1b17-4435-bbf5-8377eb01bc30/watermark:F/width:832' \
              'https://media.canva.com/v2/image-resize/format:PNG/quality:100/uri:ifs%3A%2F%2FM%2F37b55bdc-1b17-4435-bbf5-8377eb01bc30'; do
              tmp="$(mktemp --suffix=.png)"
              http="$(curl -L --silent --show-error --max-time 90 -o "$tmp" -w '%{http_code}' "$url" || true)"
              bytes="$(wc -c < "$tmp" | tr -d ' ')"
              actual="$(sha256sum "$tmp" | awk '{print $1}')"
              printf 'ifs http=%s bytes=%s sha256=%s\n' "$http" "$bytes" "$actual" >> "$LOG"
              if [ "$http" = '200' ] && [ "$actual" = "$EXPECTED" ]; then
                mv "$tmp" "$OUT"
                matched=1
                echo 'IFS_RESULT PASS exact file' >> "$LOG"
                break
              fi
              if [ "$http" = '200' ]; then
                pixel="$(python3 -c "import hashlib,subprocess,sys; subprocess.run([sys.executable,'-m','pip','install','--quiet','pillow'],check=False,stdout=subprocess.DEVNULL); from PIL import Image; im=Image.open(sys.argv[1]).convert('RGBA'); print(str(im.width)+'x'+str(im.height)+' '+hashlib.sha256(im.tobytes()).hexdigest())" "$tmp" 2>/dev/null || true)"
                printf 'ifs_pixels %s\n' "$pixel" >> "$LOG"
                if [ "$pixel" = "832x1248 $EXPECTED_PIXELS" ]; then
                  echo 'IFS_PIXEL_RESULT PASS visual pixels only; exact file still required' >> "$LOG"
                fi
              fi
              rm -f "$tmp"
            done
            if [ "$matched" -eq 0 ]; then
              echo 'IFS_RESULT FAIL no exact canonical file' >> "$LOG"
            else
              rm -f .binary-stage/canva-primary.request
            fi
          fi

          if [ -f .binary-stage/raw-primary.parts ]; then
            : > "$OUT"
            while IFS= read -r part; do
              [ -n "$part" ] || continue
              cat ".binary-stage/raw-primary/$part" >> "$OUT"
            done < .binary-stage/raw-primary.parts
            ACTUAL="$(sha256sum "$OUT" | awk '{print $1}')"
            BYTES="$(wc -c < "$OUT" | tr -d ' ')"
            printf 'primary_bytes=%s\nprimary_sha256=%s\n' "$BYTES" "$ACTUAL" >> "$LOG"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              rm -f "$OUT"
              echo 'RESULT FAIL primary hash mismatch' >> "$LOG"
              exit 1
            fi
            rm -rf .binary-stage/raw-primary .binary-stage/raw-primary.parts
            echo 'RESULT PASS exact canonical primary' >> "$LOG"
          fi

          git config user.name 'DexGPT staging'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'staging: reconstruct verified binary payloads'
            git push origin HEAD:dexgpt-staging
          fi
