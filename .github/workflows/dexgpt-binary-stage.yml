name: DexGPT Binary Stage

on:
  push:
    branches: [dexgpt-staging]
    paths:
      - '.github/workflows/dexgpt-binary-stage.yml'
      - '.binary-stage/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: dexgpt-staging
          fetch-depth: 0

      - name: Reconstruct or retrieve binaries and record evidence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p docs/visual-evolution/tooling
          LOG='docs/visual-evolution/tooling/canonical-drive-stage.log'
          : > "$LOG"
          rc=0

          fetch_drive_match() {
            local expected="$1"
            local out="$2"
            shift 2
            mkdir -p "$(dirname "$out")"
            echo "TARGET $out EXPECTED $expected" >> "$LOG"
            for id in "$@"; do
              tmp="$(mktemp)"
              for url in \
                "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
                "https://drive.google.com/uc?export=download&id=${id}&confirm=t"; do
                http="$(curl -L --silent --show-error --retry 1 --max-time 60 -o "$tmp" -w '%{http_code}' "$url" || true)"
                bytes="$(wc -c < "$tmp" | tr -d ' ')"
                actual="$(sha256sum "$tmp" | awk '{print $1}')"
                echo "TRY id=$id http=$http bytes=$bytes sha256=$actual" >> "$LOG"
                if [ "$http" = '200' ] && [ "$actual" = "$expected" ]; then
                  mv "$tmp" "$out"
                  echo "MATCH id=$id out=$out" >> "$LOG"
                  return 0
                fi
              done
              rm -f "$tmp"
            done
            echo "NO_MATCH out=$out" >> "$LOG"
            return 1
          }

          if [ -f .binary-stage/canonical-assets.request ]; then
            fetch_drive_match \
              '17fbbffea8e4e079295b0cd651dcccb4749d4548d209c9b1bdd74ae6d504ee73' \
              'assets/source-reference/shard-god/1761893423477.jpg.png' \
              '1JQGkyUBru2yDz0UZKCjqpakdin6gl20m' \
              '1ZETwfDusGnwDA4JuxtQ5-W3B2UeCqYEM' \
              '1Jv8EonzWXn_Ox25iYgBjcMYzNb0Ba-Zz' || rc=1
            fetch_drive_match \
              '7bded902f531b3419908aab60c043fe1d379a47d7db91cd3ae514fd1811c817a' \
              'assets/source-reference/shard-god/1763713752850.jpg' \
              '1jFUMxJM8gjaEvBmcXNElIzpvlPSZ7pEN' \
              '1IjUNOxW5aNThEGg04iZNsXHNdMTOUcE4' \
              '1Xr7_--6UJwBasJo-a8BAwm5x_PWVzWOb' \
              '18xGx0T7rXTvDMxGAzLS9p6Vs5toqmuPy' \
              '1Zqygp9DmNZmLsL4FpM_LuPFJQY4L_A5z' || rc=1
            if [ "$rc" -eq 0 ]; then
              rm -f .binary-stage/canonical-assets.request
              echo 'RESULT PASS' >> "$LOG"
            else
              echo 'RESULT FAIL' >> "$LOG"
            fi
          elif compgen -G '.binary-stage/*.parts' > /dev/null; then
            set -e
            while IFS= read -r manifest; do
              out="$(head -n 1 "$manifest")"
              mkdir -p "$(dirname "$out")"
              : > "$out.b64"
              tail -n +2 "$manifest" | while IFS= read -r part; do
                cat ".binary-stage/$part" >> "$out.b64"
              done
              base64 -d "$out.b64" > "$out"
              rm "$out.b64"
            done < <(find .binary-stage -maxdepth 1 -name '*.parts' -print | sort)
            echo 'RESULT PASS parts' >> "$LOG"
          else
            printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > docs/visual-evolution/tooling/binary-probe.png
            echo 'RESULT PASS probe' >> "$LOG"
          fi

          git config user.name 'DexGPT staging'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'staging: reconstruct binary payloads'
            git push origin HEAD:dexgpt-staging
          fi
          exit "$rc"
