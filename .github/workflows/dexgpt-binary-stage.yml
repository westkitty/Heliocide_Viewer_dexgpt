name: DexGPT Binary Stage

on:
  push:
    branches:
      - dexgpt-staging
    paths:
      - '.github/workflows/dexgpt-binary-stage.yml'
      - '.binary-stage/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: dexgpt-staging
          fetch-depth: 0

      - name: Reconstruct verified binary payloads
        shell: bash
        run: |
          set -euo pipefail
          LOG='docs/visual-evolution/tooling/binary-stage.log'
          mkdir -p "$(dirname "$LOG")"
          printf 'trigger_sha=%s\n' "$GITHUB_SHA" > "$LOG"

          if [ -f .binary-stage/canva-primary.request ]; then
            OUT='assets/source-reference/shard-god/1761893423477.jpg.png'
            EXPECTED='17fbbffea8e4e079295b0cd651dcccb4749d4548d209c9b1bdd74ae6d504ee73'
            PAGE="$(mktemp)"
            URLS="$(mktemp)"
            curl -L --silent --show-error --max-time 90 'https://www.canva.com/d/k0eds-WmZiQxrCB' -o "$PAGE" || true
            python3 -c "import html,re,sys; t=open(sys.argv[1],errors='ignore').read().replace('\\\\/','/').replace('\\\\u0026','&'); u=[]; [u.append(html.unescape(x)) for x in re.findall(r'https://[^\\\"<> ]+',t) if ('canva.com' in x or 'amazonaws.com' in x) and x not in u]; print('\\n'.join(u))" "$PAGE" > "$URLS"
            printf 'canva_page_bytes=%s\ncanva_candidate_urls=%s\n' "$(wc -c < "$PAGE" | tr -d ' ')" "$(wc -l < "$URLS" | tr -d ' ')" >> "$LOG"
            matched=0
            i=0
            while IFS= read -r url && [ "$i" -lt 200 ]; do
              [ -n "$url" ] || continue
              tmp="$(mktemp)"
              http="$(curl -L --silent --show-error --max-time 45 -o "$tmp" -w '%{http_code}' "$url" || true)"
              bytes="$(wc -c < "$tmp" | tr -d ' ')"
              actual="$(sha256sum "$tmp" | awk '{print $1}')"
              printf 'canva_candidate_%s http=%s bytes=%s sha256=%s\n' "$i" "$http" "$bytes" "$actual" >> "$LOG"
              if [ "$http" = '200' ] && [ "$actual" = "$EXPECTED" ]; then
                mkdir -p "$(dirname "$OUT")"
                mv "$tmp" "$OUT"
                matched=1
                break
              fi
              rm -f "$tmp"
              i=$((i+1))
            done < "$URLS"
            rm -f "$PAGE" "$URLS"
            if [ "$matched" -eq 1 ]; then
              rm -f .binary-stage/canva-primary.request
              echo 'CANVA_RESULT PASS exact canonical primary' >> "$LOG"
            else
              echo 'CANVA_RESULT FAIL no exact canonical primary' >> "$LOG"
            fi
          fi

          if [ -f .binary-stage/raw-primary.parts ]; then
            OUT='assets/source-reference/shard-god/1761893423477.jpg.png'
            EXPECTED='17fbbffea8e4e079295b0cd651dcccb4749d4548d209c9b1bdd74ae6d504ee73'
            mkdir -p "$(dirname "$OUT")"
            : > "$OUT"
            while IFS= read -r part; do
              [ -n "$part" ] || continue
              cat ".binary-stage/raw-primary/$part" >> "$OUT"
            done < .binary-stage/raw-primary.parts
            ACTUAL="$(sha256sum "$OUT" | awk '{print $1}')"
            BYTES="$(wc -c < "$OUT" | tr -d ' ')"
            printf 'primary_bytes=%s\nprimary_sha256=%s\n' "$BYTES" "$ACTUAL" >> "$LOG"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              rm -f "$OUT"
              echo 'RESULT FAIL primary hash mismatch' >> "$LOG"
              exit 1
            fi
            rm -rf .binary-stage/raw-primary .binary-stage/raw-primary.parts
            echo 'RESULT PASS exact canonical primary' >> "$LOG"
          elif [ ! -f .binary-stage/canva-primary.request ]; then
            echo 'RESULT PASS trigger-only' >> "$LOG"
          fi

          git config user.name 'DexGPT staging'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'staging: reconstruct verified binary payloads'
            git push origin HEAD:dexgpt-staging
          fi
